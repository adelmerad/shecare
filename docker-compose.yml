services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shecare
      POSTGRES_PASSWORD: shecare
      POSTGRES_DB: shecare
    ports:
      - "5433:5432"
    volumes:
      - shecare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shecare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shecare-db:
